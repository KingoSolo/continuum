---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: continuum-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: continuum-api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: continuum-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
      name: http

---
# Web Service
apiVersion: v1
kind: Service
metadata:
  name: continuum-web
  namespace: {{ .Values.global.namespace }}
  labels:
    app: continuum-web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app: continuum-web
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: {{ .Values.web.service.targetPort }}
      protocol: TCP
      name: http
